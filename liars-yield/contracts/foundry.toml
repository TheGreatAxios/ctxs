[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "istanbul"
via_ir = false
ffi = true
ast = true
build_info = true
extra_output = ["storage-layout", "evm.bytecode"]
fs_permissions = [{ access = "read", path = "./"}]

[rpc_endpoints]
skale_testnet = "https://base-sepolia-testnet.skalenodes.com/v1/fancy-this-usable-SKALE"
