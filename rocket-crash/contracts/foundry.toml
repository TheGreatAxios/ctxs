[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
evm_version = "istanbul"
via_ir = false
optimizer = true
optimizer_runs = 200

# Remappings
remappings = [
    "skale-rng/=lib/skale-rng/contracts/",
]

[rpc_endpoints]
skale_testnet = "https://base-sepolia-testnet.skalenodes.com/v1/bite-v2-sandbox"  # Chain 103698795
