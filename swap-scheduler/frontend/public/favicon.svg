<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .fangs-fill { fill: #2A2420; }
      .fangs-stroke { stroke: #FFFFFF; stroke-width: 2.5; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Shadow offset -->
  <g transform="translate(2, 2)">
    <!-- Left fang shadow -->
    <path d="M24,22 L20,40 L25,40 L27,22Z"
          class="fangs-fill"/>
    <!-- Right fang shadow -->
    <path d="M40,22 L44,40 L39,40 L37,22Z"
          class="fangs-fill"/>
    <!-- Gum line shadow -->
    <path d="M18,22 C18,22 23,25 32,25 C41,25 46,22 46,22"
          fill="none"
          stroke="#2A2420"
          stroke-width="3"
          stroke-linecap="round"/>
  </g>

  <!-- Main logo -->
  <g>
    <!-- Left fang -->
    <path d="M23,20 L19,38 L24,38 L26,20Z"
          class="fangs-fill fangs-stroke"/>

    <!-- Right fang -->
    <path d="M38,20 L42,38 L37,38 L35,20Z"
          class="fangs-fill fangs-stroke"/>

    <!-- Gum line - curved smile -->
    <path d="M16,20 C16,20 21,23 30,23 C39,23 44,20 44,20"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Fang highlights for depth -->
  <g>
    <!-- Left fang highlight -->
    <path d="M22,21 L20,32"
          stroke="#FFFFFF"
          stroke-width="1"
          stroke-linecap="round"
          opacity="0.3"/>
    <!-- Right fang highlight -->
    <path d="M39,21 L41,32"
          stroke="#FFFFFF"
          stroke-width="1"
          stroke-linecap="round"
          opacity="0.3"/>
  </g>
</svg>