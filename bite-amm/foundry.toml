[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "sushiswap/v2-core/=lib/sushiswap-v2-core/contracts/",
]

[rpc_endpoints]
skale_testnet = "https://base-sepolia-testnet.skalenodes.com/v1/miniature-live-tabit"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
